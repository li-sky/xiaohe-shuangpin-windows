name: Validate Windows registry and Scoop install
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: python scripts/package.py
      - name: Test with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/windows.ps1
      - name: Test with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/windows.ps1
